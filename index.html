<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corentin Bel</title>
<meta name="description" content="Corentin Bel — five creatures, five corners of my internet. Catch one.">
<style>
  :root {
    --bg: #07080c;
    --fg: #e8e6df;
    --dim: #8a8fa3;
    --accent: #6ea8ff;
    --purple: #b48ce8;
    --teal: #8ceedd;
    --amber: #ffc46b;
    --coral: #ff9d7a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, "Inter", "Helvetica Neue", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- ambience layers ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora div {
    position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%;
    filter: blur(70px); opacity: .16; will-change: transform;
  }
  .aurora .a1 { left: -12vmax; top: -18vmax; background: radial-gradient(circle at 40% 40%, var(--accent), transparent 65%); animation: drift1 47s ease-in-out infinite alternate; }
  .aurora .a2 { right: -16vmax; top: 8vmax; background: radial-gradient(circle at 55% 45%, var(--purple), transparent 65%); animation: drift2 61s ease-in-out infinite alternate; }
  .aurora .a3 { left: 22vw; bottom: -26vmax; background: radial-gradient(circle at 50% 35%, var(--teal), transparent 65%); animation: drift3 53s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(14vw, 10vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-12vw, 14vh) scale(0.9); } }
  @keyframes drift3 { to { transform: translate(10vw, -12vh) scale(1.1); } }

  canvas#fx { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; pointer-events: none; }

  /* ---------- header / footer ---------- */
  header {
    position: fixed; top: 1.3rem; left: 1.6rem; z-index: 5; pointer-events: none;
  }
  header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: .05em; }
  header p { color: var(--dim); font-size: .84rem; margin-top: .25rem; max-width: 30rem; line-height: 1.5; }
  footer {
    position: fixed; bottom: .65rem; width: 100%; text-align: center;
    color: #4a4f61; font-size: .78rem; z-index: 6;
  }
  footer a { color: #6a7089; text-decoration: none; padding: .2rem .15rem; }
  footer a:hover, footer a:focus-visible { color: var(--fg); text-decoration: underline; }

  /* ---------- field & creatures ---------- */
  #field {
    position: fixed; inset: 0; z-index: 2;
    user-select: none; -webkit-user-select: none;
  }
  .creature {
    color: var(--fg); text-decoration: none; cursor: pointer;
    touch-action: manipulation;
  }
  .creature svg { overflow: visible; display: block; transition: transform .25s ease, filter .3s ease; }
  .creature .tag {
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%) translateY(4px); white-space: nowrap;
    font-size: .82rem; font-weight: 500; letter-spacing: .03em;
    padding: .3rem .7rem; border-radius: 99px;
    background: rgba(13, 15, 22, .82); border: 1px solid var(--hue, var(--accent));
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .creature:hover .tag, .creature:focus-visible .tag,
  .creature.armed .tag, .creature.excited .tag {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
  .creature:focus-visible { outline: 2px solid var(--hue, var(--accent)); outline-offset: 6px; border-radius: 14px; }

  /* --- interactive (play) mode --- */
  body.play #field { display: block; }
  body.play .creature {
    position: absolute; left: 0; top: 0; will-change: transform;
  }
  body.play .creature .inner { display: block; position: relative; will-change: transform; }
  body.play .creature:hover svg, body.play .creature:focus-visible svg {
    transform: scale(1.14); animation: wiggle .5s ease;
    filter: drop-shadow(0 0 16px var(--hue, var(--accent)));
  }
  body.play .creature.excited svg { filter: drop-shadow(0 0 14px var(--hue, var(--accent))); }
  @keyframes wiggle {
    0%,100% { transform: scale(1.14) rotate(0); }
    25% { transform: scale(1.16) rotate(-6deg); }
    65% { transform: scale(1.16) rotate(5deg); }
  }

  /* --- static / reduced-motion / no-JS fallback: neat grid of cards --- */
  body:not(.play) #field {
    position: fixed; inset: 0;
    display: flex; flex-wrap: wrap; gap: 1.2rem;
    align-items: center; justify-content: center; align-content: center;
    padding: 6.5rem 1.4rem 4rem;
  }
  body:not(.play) .creature {
    display: flex; flex-direction: column; align-items: center; gap: .8rem;
    padding: 1.3rem 1.5rem 1.1rem; min-width: 10.2rem;
    border: 1px solid #262b3d; border-radius: 16px;
    background: rgba(14, 16, 24, .6);
    transition: border-color .25s, transform .25s;
  }
  body:not(.play) .creature:hover, body:not(.play) .creature:focus-visible {
    border-color: var(--hue, var(--accent)); transform: translateY(-3px);
  }
  body:not(.play) .creature .tag {
    position: static; opacity: 1; transform: none; border-color: transparent;
    background: none; box-shadow: none; padding: 0;
  }
  body:not(.play) #tray, body:not(.play) canvas#fx { display: none; }
  body:not(.play) .aurora div { animation: none; }
  body:not(.play) svg .anim { animation: none !important; }

  /* per-creature hue variables */
  #cr-mouse  { --hue: var(--coral); }
  #cr-jelly  { --hue: var(--purple); }
  #cr-bird   { --hue: var(--teal); }
  #cr-petrel { --hue: var(--accent); }
  #cr-duck   { --hue: var(--amber); }

  /* ---------- SVG idle animations ---------- */
  .creature svg .anim { transform-box: fill-box; transform-origin: center; }
  .eye     { animation: blink 4.6s infinite; }
  .m-tail  { transform-origin: right center; animation: tailWig 2.3s ease-in-out infinite; }
  .bell    { animation: pulse 2.8s ease-in-out infinite; }
  .tend    { transform-origin: center top; animation: sway 3.4s ease-in-out infinite; }
  .t2 { animation-delay: -.6s; } .t3 { animation-delay: -1.2s; }
  .t4 { animation-delay: -1.9s; } .t5 { animation-delay: -2.5s; }
  .wing    { transform-origin: 30% 20%; animation: flap 1.05s ease-in-out infinite; }
  .gwing-l { transform-origin: right center; animation: gtilt 2.6s ease-in-out infinite; }
  .gwing-r { transform-origin: left center; animation: gtilt 2.6s ease-in-out infinite reverse; }
  .bobber  { animation: bob 1.7s ease-in-out infinite; }
  .spray   { animation: sprayFlick 0.9s ease-in-out infinite; }
  @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
  @keyframes tailWig { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.05,.94); } }
  @keyframes sway { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  @keyframes flap { 0%,100% { transform: rotate(4deg); } 45% { transform: rotate(-26deg); } }
  @keyframes gtilt { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-5deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-3px) rotate(1.8deg); } }
  @keyframes sprayFlick { 0%,100% { opacity: .25; } 50% { opacity: .8; } }

  /* ---------- lure tray ---------- */
  #tray {
    position: fixed; bottom: 2.1rem; left: 50%; transform: translateX(-50%);
    z-index: 6; display: flex; gap: .35rem; padding: .5rem .7rem;
    border-radius: 20px; border: 1px solid rgba(140, 150, 190, .28);
    background: rgba(16, 18, 28, .55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .token {
    position: relative; border: none; background: none; cursor: grab;
    font-size: 1.65rem; line-height: 1; padding: .5rem .55rem; border-radius: 14px;
    touch-action: none; transition: background .2s, transform .15s;
  }
  .token:hover, .token:focus-visible { background: rgba(110, 168, 255, .14); transform: translateY(-3px); }
  .token.picked { background: rgba(180, 140, 232, .25); box-shadow: 0 0 0 1.5px var(--purple); transform: translateY(-4px); }
  .token .tip {
    position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
    white-space: nowrap; font-size: .74rem; font-family: inherit; color: var(--dim);
    background: rgba(13,15,22,.9); border: 1px solid #2a2e3d; border-radius: 8px;
    padding: .25rem .55rem; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .token:hover .tip, .token:focus-visible .tip, .token.picked .tip { opacity: 1; }

  /* ---------- lure on the field + particles ---------- */
  .lure {
    position: absolute; z-index: 3; font-size: 1.9rem; line-height: 1;
    transform: translate(-50%, -50%); pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(255, 220, 140, .5));
    animation: lureIn .55s cubic-bezier(.25, 1.6, .5, 1);
    transition: opacity 2s ease;
  }
  .lure.fading { opacity: 0; }
  @keyframes lureIn {
    0% { transform: translate(-50%, -180%) scale(.4); opacity: 0; }
    60% { transform: translate(-50%, -42%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  .pop {
    position: absolute; z-index: 4; font-size: 1.25rem; font-weight: 700;
    transform: translate(-50%, -100%); pointer-events: none;
    animation: popUp 1s ease-out forwards;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  @keyframes popUp {
    0% { opacity: 0; margin-top: 0; }
    18% { opacity: 1; }
    100% { opacity: 0; margin-top: -34px; }
  }
  #ghost {
    position: fixed; z-index: 9; font-size: 1.9rem; line-height: 1;
    transform: translate(-50%, -50%); pointer-events: none; display: none;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,.5));
  }

  @media (max-width: 560px) {
    header { left: 1.1rem; right: 1.1rem; }
    header p { font-size: .78rem; }
    .token { font-size: 1.45rem; }
    footer { font-size: .72rem; }
  }
</style>
</head>

  var creatures = [];
  var W = 0, H = 0, DPR = 1;

  var sparks = [];
  var running = false;
  var rafId = 0;
  var last = 0;

  // ---------- helpers ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  function bounds() {
    return { x0: 50, y0: 110, x1: W - 50, y1: H - 150 };
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    creatures.forEach(function (c) {
      c.hw = c.el.offsetWidth / 2; c.hh = c.el.offsetHeight / 2;
      var b = bounds();
      c.x = clamp(c.x, b.x0, b.x1); c.y = clamp(c.y, b.y0, b.y1);
    });
  }

  function spawnPop(x, y, glyph, color) {
    var p = document.createElement('div');
    p.className = 'pop';
    p.textContent = glyph;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    if (color) p.style.color = color;
    field.appendChild(p);
    p.addEventListener('animationend', function () { p.remove(); });
    setTimeout(function () { p.remove(); }, 1400);
  }

  // ---------- creatures ----------
  function initCreatures() {
    var b = bounds();
    SPECIES.forEach(function (s, i) {
      var el = document.getElementById(s.id);
      var inner = el.querySelector('.inner');
      var c = {
        el: el, inner: inner, spec: s,
        x: rand(b.x0 + 60, b.x1 - 60),
        y: b.y0 + (b.y1 - b.y0) * ((i + 0.5) / SPECIES.length) * rand(0.7, 1.1),
        vx: 0, vy: 0,
        p1: rand(0, 6.28), p2: rand(0, 6.28),
        bias: rand(0, 6.28),
        face: 1,
        mode: 'wander',
        timer: 0, cool: rand(0, 3),
        orbitA: rand(0, 6.28),
        hovered: false, armed: false, armTimer: 0,
        trail: [],
        hw: el.offsetWidth / 2, hh: el.offsetHeight / 2
      };
      c.y = clamp(c.y, b.y0, b.y1);

      el.addEventListener('pointerenter', function () { c.hovered = true; });
      el.addEventListener('pointerleave', function () { c.hovered = false; });
      el.addEventListener('focus', function () { c.hovered = true; });
      el.addEventListener('blur', function () { c.hovered = false; });
      el.addEventListener('pointerdown', function (e) { lastPointerType = e.pointerType || 'mouse'; });
      el.addEventListener('dragstart', function (e) { e.preventDefault(); });
      // touch: first tap shows the tag, second tap navigates
      el.addEventListener('click', function (e) {
        if (lastPointerType === 'touch' && !c.armed) {
          e.preventDefault();
          creatures.forEach(function (o) { o.armed = false; o.el.classList.remove('armed'); });
          c.armed = true; c.armTimer = 3.5;
          el.classList.add('armed');
        }
      });
      creatures.push(c);
    });
  }

  function setMode(c, mode, t) {
    c.mode = mode;
    c.timer = t || 0;
    if (mode === 'orbit') c.el.classList.add('excited');
    else c.el.classList.remove('excited');
  }

  function update(c, dt, t) {
    var s = c.spec;
    var b = bounds();

    if (c.armed) {
      c.armTimer -= dt;
      if (c.armTimer <= 0) { c.armed = false; c.el.classList.remove('armed'); }
    }

    var tvx = 0, tvy = 0;
    var pd = pointer.seen ? dist(c.x, c.y, pointer.x, pointer.y) : 1e9;

    if (c.hovered || c.armed) {
      // never escape a creature the visitor has reached
      tvx = 0; tvy = 0;
    } else if (c.mode === 'flee') {
      c.timer -= dt;
      var fa = Math.atan2(c.y - pointer.y, c.x - pointer.x);
      tvx = Math.cos(fa) * s.speed * 1.9;
      tvy = Math.sin(fa) * s.speed * 1.9;
      if (c.timer <= 0) { setMode(c, 'wander'); c.cool = rand(5, 9); }
    } else if (c.mode === 'approach') {
      c.timer -= dt;
      if (pd > 90 && pointer.seen) {
        var aa = Math.atan2(pointer.y - c.y, pointer.x - c.x);
        tvx = Math.cos(aa) * s.speed * 0.8;
        tvy = Math.sin(aa) * s.speed * 0.8;
      }
      if (c.timer <= 0 || !pointer.seen) { setMode(c, 'wander'); c.cool = rand(4, 8); }
    } else if (c.mode === 'rush' && lure) {
      var ld = dist(c.x, c.y, lure.x, lure.y);
      if (ld < 62) {
        setMode(c, 'orbit');
      } else {
        var ra = Math.atan2(lure.y - c.y, lure.x - c.x);
        tvx = Math.cos(ra) * s.speed * 2.1;
        tvy = Math.sin(ra) * s.speed * 2.1;
      }
    } else if (c.mode === 'orbit' && lure) {
      c.orbitA += dt * 1.5;
      var ox = lure.x + Math.cos(c.orbitA) * 48;
      var oy = lure.y + Math.sin(c.orbitA) * 40;
      tvx = (ox - c.x) * 4;
      tvy = (oy - c.y) * 4;
      if (Math.random() < 0.1) {
        sparks.push({ x: c.x + rand(-14, 14), y: c.y + rand(-14, 14), vy: rand(-30, -14), life: 1, rgb: s.rgb });
      }
    } else if (c.mode === 'sniff' && lure) {
      var sd = dist(c.x, c.y, lure.x, lure.y);
      if (sd < 74) {
        setMode(c, 'sniffwait', 0.9);
      } else {
        var sa = Math.atan2(lure.y - c.y, lure.x - c.x);
        tvx = Math.cos(sa) * s.speed * 0.9;
        tvy = Math.sin(sa) * s.speed * 0.9;
      }
    } else if (c.mode === 'sniffwait') {
      c.timer -= dt;
      if (c.timer <= 0) {
        spawnPop(c.x, c.y - c.hh - 8, '?', 'rgb(' + s.rgb.join(',') + ')');
        setMode(c, 'wander');
        c.cool = rand(3, 5);
        if (lure) { // stroll off, unimpressed
          var wa = Math.atan2(c.y - lure.y, c.x - lure.x) + rand(-0.5, 0.5);
          c.vx = Math.cos(wa) * s.speed; c.vy = Math.sin(wa) * s.speed;
        }
      }
    } else { // wander (also fallback when a lure vanished mid-mode)
      if (c.mode !== 'wander') setMode(c, 'wander');
      c.bias += rand(-0.5, 0.5) * dt * 1.6;
      var na = c.bias + Math.sin(t * s.f1 + c.p1) * 1.3 + Math.sin(t * s.f2 + c.p2) * 0.7;
      tvx = Math.cos(na) * s.speed;
      tvy = Math.sin(na) * s.speed;

      // pointer encounter: occasionally flee (shyness) or come look (curiosity)
      c.cool -= dt;
      if (pointer.seen && pd < 170 && c.cool <= 0 && !lure) {
        var roll = Math.random();
        if (roll < s.shy) setMode(c, 'flee', rand(0.7, 1.2));
        else if (roll < s.shy + s.cur) setMode(c, 'approach', rand(2.5, 4));
        else c.cool = rand(2.5, 4);
      }
    }

    // soft steering back into bounds
    if (c.x < b.x0 + 40) tvx += (b.x0 + 40 - c.x) * 2.2;
    if (c.x > b.x1 - 40) tvx -= (c.x - (b.x1 - 40)) * 2.2;
    if (c.y < b.y0 + 30) tvy += (b.y0 + 30 - c.y) * 2.2;
    if (c.y > b.y1 - 30) tvy -= (c.y - (b.y1 - 30)) * 2.2;

    var k = clamp(dt * ((c.mode === 'rush' || c.mode === 'flee') ? 5 : 2.2), 0, 1);
    c.vx += (tvx - c.vx) * k;
    c.vy += (tvy - c.vy) * k;
    c.x = clamp(c.x + c.vx * dt, b.x0, b.x1);
    c.y = clamp(c.y + c.vy * dt, b.y0, b.y1);

    // trail
    var sp = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
    if (sp > 12) c.trail.push({ x: c.x, y: c.y + c.hh * 0.4, life: 1 });
    if (c.trail.length > 26) c.trail.shift();
    for (var i = c.trail.length - 1; i >= 0; i--) {
      c.trail[i].life -= dt * 1.4;
      if (c.trail[i].life <= 0) c.trail.splice(i, 1);
    }

    // orientation + squash-and-stretch
    if (Math.abs(c.vx) > 14) c.face = c.vx >= 0 ? 1 : -1;
    var sq = clamp(sp / (s.speed * 1.8), 0, 1);
    var sx = 1 + 0.16 * sq, sy = 1 - 0.12 * sq;
    var tilt;
    if (s.sway) { tilt = clamp(c.vx * 0.005, -0.3, 0.3); c.face = 1; }
    else { tilt = clamp(Math.atan2(c.vy, Math.abs(c.vx) + 20) * 0.55, -0.5, 0.5); }

    c.el.style.transform = 'translate3d(' + (c.x - c.hw).toFixed(1) + 'px,' + (c.y - c.hh).toFixed(1) + 'px,0)';
    c.inner.style.transform = 'scale(' + (c.face * sx).toFixed(3) + ',' + sy.toFixed(3) + ') rotate(' + tilt.toFixed(3) + 'rad)';
  }

  // ---------- lures ----------
  function removeLure(fast) {
    if (!lure) return;
    var el = lure.el;
    clearTimeout(lure.fadeT); clearTimeout(lure.killT);
    if (fast) el.remove();
    else { el.classList.add('fading'); setTimeout(function () { el.remove(); }, 2100); }
    lure = null;
    creatures.forEach(function (c) {
      if (c.mode === 'rush' || c.mode === 'orbit' || c.mode === 'sniff' || c.mode === 'sniffwait') setMode(c, 'wander');
    });
  }

  function placeLure(type, x, y) {
    removeLure(true);
    var b = bounds();
    x = clamp(x, b.x0 + 20, b.x1 - 20);
    y = clamp(y, b.y0 + 20, b.y1 - 20);
    var el = document.createElement('div');
    el.className = 'lure';
    el.textContent = LURE_EMOJI[type];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    field.appendChild(el);
    lure = { el: el, x: x, y: y, type: type };
    lure.fadeT = setTimeout(function () { if (lure && lure.el === el) el.classList.add('fading'); }, 13000);
    lure.killT = setTimeout(function () { if (lure && lure.el === el) removeLure(true); }, 15000);

    var match = null, others = [];
    creatures.forEach(function (c) {
      if (c.spec.lure === type) match = c; else others.push(c);
    });
    if (match) {
      spawnPop(match.x, match.y - match.hh - 8, '!', 'rgb(' + match.spec.rgb.join(',') + ')');
      setMode(match, 'rush');
    }
    // comedy: sometimes one wrong creature wanders over, sniffs, leaves
    if (others.length && Math.random() < 0.35) {
      var wrong = others[Math.floor(Math.random() * others.length)];
      setTimeout(function () {
        if (lure && lure.el === el && wrong.mode === 'wander' && !wrong.hovered) setMode(wrong, 'sniff');
      }, 900);
    }
  }

  // ---------- tray: drag OR tap-then-tap ----------
  var pickedType = null;
  var drag = null; // { type, id, startX, startY, moved }

  function clearPicked() {
    pickedType = null;
    document.querySelectorAll('.token.picked').forEach(function (t) { t.classList.remove('picked'); });
  }

  document.querySelectorAll('.token').forEach(function (btn) {
    var type = btn.dataset.lure;
    btn.addEventListener('pointerdown', function (e) {
      lastPointerType = e.pointerType || 'mouse';
      e.preventDefault();
      drag = { type: type, id: e.pointerId, startX: e.clientX, startY: e.clientY, moved: false };
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    });
    btn.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moved && dist(e.clientX, e.clientY, drag.startX, drag.startY) > 9) {
        drag.moved = true;
        ghost.textContent = LURE_EMOJI[type];
        ghost.style.display = 'block';
      }
      if (drag.moved) {
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
      }
    });
    btn.addEventListener('pointerup', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      ghost.style.display = 'none';
      if (drag.moved) {
        var trayTop = document.getElementById('tray').getBoundingClientRect().top;
        if (e.clientY < trayTop - 12) placeLure(type, e.clientX, e.clientY);
        clearPicked();
      } else {
        // tap: pick this lure, next tap on the field drops it
        if (pickedType === type) clearPicked();
        else { clearPicked(); pickedType = type; btn.classList.add('picked'); }
      }
      drag = null;
    });
    btn.addEventListener('pointercancel', function () { ghost.style.display = 'none'; drag = null; });
  });

  // drop a picked lure on the field
  document.addEventListener('pointerdown', function (e) {
    lastPointerType = e.pointerType || 'mouse';
    if (!pickedType) return;
    if (e.target.closest('#tray') || e.target.closest('.creature') ||
        e.target.closest('footer') || e.target.closest('header')) return;
    placeLure(pickedType, e.clientX, e.clientY);
    clearPicked();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') clearPicked();
  });
  // keyboard: Enter/Space on a token picks it, drop lands mid-field
  document.querySelectorAll('.token').forEach(function (btn) {
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        placeLure(btn.dataset.lure, W / 2, H / 2);
        clearPicked();
      }
    });
  });

  window.addEventListener('pointermove', function (e) {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.seen = true;
  });
  window.addEventListener('pointerleave', function () { pointer.seen = false; });

  // ---------- canvas: dust, trails, sparks ----------
  var PALETTE = [[110, 168, 255], [180, 140, 232], [140, 238, 221], [255, 196, 107], [255, 157, 122]];
  function initDust() {
    dust = [];
    var n = Math.min(56, Math.round(W * H / 26000));
    for (var i = 0; i < n; i++) {
      dust.push({
        x: rand(0, W), y: rand(0, H),
        vx: rand(-6, 6), vy: rand(-4, 4),
        r: rand(0.8, 2.2), a: rand(0.12, 0.32),
        rgb: PALETTE[i % PALETTE.length],
        ph: rand(0, 6.28)
      });
    }
  }

  function drawFx(dt, t) {
    ctx.clearRect(0, 0, W, H);
    // dust
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      d.x += d.vx * dt; d.y += (d.vy + Math.sin(t + d.ph) * 3) * dt;
      if (d.x < -5) d.x = W + 5; if (d.x > W + 5) d.x = -5;
      if (d.y < -5) d.y = H + 5; if (d.y > H + 5) d.y = -5;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + d.rgb.join(',') + ',' + (d.a * (0.7 + 0.3 * Math.sin(t * 0.8 + d.ph))).toFixed(3) + ')';
      ctx.fill();
    }
    // creature trails
    creatures.forEach(function (c) {
      var rgb = c.spec.rgb.join(',');
      for (var j = 0; j < c.trail.length; j++) {
        var p = c.trail[j];
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2 + 4 * p.life, 0, 6.2832);
        ctx.fillStyle = 'rgba(' + rgb + ',' + (0.16 * p.life).toFixed(3) + ')';
        ctx.fill();
      }
    });
    // sparks
    for (var s2 = sparks.length - 1; s2 >= 0; s2--) {
      var sp = sparks[s2];
      sp.y += sp.vy * dt; sp.life -= dt * 1.3;
      if (sp.life <= 0) { sparks.splice(s2, 1); continue; }
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, 1.6 + sp.life * 1.6, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + sp.rgb.join(',') + ',' + (0.55 * sp.life).toFixed(3) + ')';
      ctx.fill();
    }
  }

  // ---------- main loop ----------
  function frame(now) {
    if (!running) return;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    var t = now / 1000;
    creatures.forEach(function (c) { update(c, dt, t); });
    drawFx(dt, t);
    rafId = requestAnimationFrame(frame);
  }

  function start() {
    if (running) return;
    running = true;
    last = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  function stop() {
    running = false;
    cancelAnimationFrame(rafId);
  }

  document.addEventListener('visibilitychange', function () {
    if (!body.classList.contains('play')) return;
    if (document.hidden) stop(); else start();
  });

  function enterPlay() {
    body.classList.add('play');
    resize();
    if (!creatures.length) initCreatures();
    resize(); // sizes valid only once absolutely positioned
    initDust();
    start();
  }
  function exitPlay() {
    stop();
    removeLure(true);
    body.classList.remove('play');
    creatures.forEach(function (c) {
      c.el.style.transform = '';
      c.inner.style.transform = '';
      c.el.classList.remove('excited', 'armed');
    });
    ctx.clearRect(0, 0, W, H);
  }

  window.addEventListener('resize', function () {
    if (body.classList.contains('play')) { resize(); initDust(); }
  });

  function applyMotionPref() {
    if (reduceMotion.matches) exitPlay(); else enterPlay();
  }
  if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', applyMotionPref);
  applyMotionPref();
})();
</script>
</body>
</html>
